services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set to "true" only when TLS is terminated by a reverse proxy.
        FORCE_SSL: ${FORCE_SSL:-false}

    container_name: bpmner-ui

    restart: unless-stopped

    ports:
      # Bind to 127.0.0.1 when a reverse proxy runs on the same host.
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-4000}:4000"

    environment:
      # Required. Generate one with: openssl rand -base64 48
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env or in the environment}
      PHX_HOST: ${PHX_HOST:-localhost}
      # Absolute URLs generated by Phoenix. Use https/443 behind a TLS proxy.
      PHX_SCHEME: ${PHX_SCHEME:-http}
      PHX_URL_PORT: ${PHX_URL_PORT:-4000}
      # The release listens on this port inside the container.
      PORT: "4000"
      # TINA's sift is bundled in the image.
      SIFT_PATH: /usr/local/bin/sift
      SIFT_MAX_STATES: ${SIFT_MAX_STATES:-200000}
      SIFT_TIMEOUT: ${SIFT_TIMEOUT:-15}
