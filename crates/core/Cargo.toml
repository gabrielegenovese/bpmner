[package]
name = "core"
version = "0.1.0"
edition = "2024"

[lib]
# The crate is named `core`, which shadows the standard library crate in
# rustdoc doctests. Disabling doctests keeps `cargo test` usable.
doctest = false

[dependencies]
netcrab = "1.0.2"
quick-xml = "0.41.0"
snurr = "0.14.0"
thiserror = "2.0.18"
