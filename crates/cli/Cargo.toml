[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net"] }
tower-http = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
wf_core = { package = "core", path = "../core" }
base64 = "0.22.1"